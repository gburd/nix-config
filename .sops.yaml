creation_rules:

  # solnix hosts' ssh host keys (dixa, dixi, lixi): the solnix.io builder identity is the host key, kept here
  # so a reinstall restores it and a rotation can be signed with the old key.
  - path_regex: nixos/solnix/secrets.ya?ml$
    key_groups:
    - age:
      - *gburd-user
      - *solnix-dev
      pgp:
      - *gburd

  - path_regex: nixos/workstation/floki/secrets.ya?ml$
    key_groups:
    - age:
      - *floki
      - *santorini
      - *gburd-user
      pgp:
      - *gburd
      - *greg
  - path_regex: nixos/workstation/meh/secrets.ya?ml$
    key_groups:
    - age:
      - *meh
      - *gburd-user
      pgp:
      - *gburd
      - *greg
  - path_regex: nixos/workstation/werk/secrets.ya?ml$
    key_groups:
    - age:
      - *werk
      - *gburd-user
      pgp:
      - *gburd
      - *greg
  - path_regex: nixos/iso-console/secrets.ya?ml$
    key_groups:
    - age:
      - *iso-console
      pgp:
      - *gburd
      - *greg
  - path_regex: nixos/iso-desktop/secrets.ya?ml$
    key_groups:
    - age:
      - *iso-desktop
      pgp:
      - *gburd
      - *greg
  - path_regex: nixos/_mixins/secrets.ya?ml$
    key_groups:
    - age:
      - *floki
      - *meh
      - *werk
      - *santorini
      - *gburd-user
      pgp:
      - *gburd
      - *greg
