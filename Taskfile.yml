version: '3'

# OS-aware tasks. On macOS the system config is nix-darwin (host "aws") and
# home-manager is applied by darwin-rebuild itself, so there is no separate
# home-manager step. On Linux the system is NixOS and home-manager is a
# standalone switch.

tasks:
  rebuild-host:
    desc: Rebuild the system configuration (nix-darwin on macOS, NixOS on Linux)
    cmds:
      - '{{if eq OS "darwin"}}darwin-rebuild switch --flake .#aws{{else}}sudo nixos-rebuild switch --flake .{{end}}'

  rebuild-home:
    desc: Rebuild the home-manager configuration (Linux only; folded into rebuild-host on macOS)
    cmds:
      - '{{if eq OS "darwin"}}echo "On macOS home-manager is applied by darwin-rebuild; run: task rebuild-host"{{else}}home-manager switch -b backup --flake .{{end}}'

  rebuild-all:
    desc: Rebuild everything for this host
    cmds:
      - '{{if eq OS "darwin"}}darwin-rebuild switch --flake .#aws{{else}}sudo nixos-rebuild switch --flake .{{end}}'
      - '{{if eq OS "darwin"}}true{{else}}home-manager switch -b backup --flake .{{end}}'

  test-build:
    desc: Test build the configuration without activation
    cmds:
      - '{{if eq OS "darwin"}}darwin-rebuild build --flake .#aws{{else}}nixos-rebuild dry-build --flake .{{end}}'
      - '{{if eq OS "darwin"}}true{{else}}home-manager build --flake .{{end}}'

  check:
    desc: Run nix flake check
    cmds:
      - nix flake check

  gc:
    desc: Garbage collect old generations (>28d)
    cmds:
      - sudo nix-collect-garbage --delete-older-than 28d
      - nix-collect-garbage --delete-older-than 28d

  fmt:
    desc: Format Nix code
    cmds:
      - nix fmt

  update:
    desc: Update flake inputs
    cmds:
      - nix flake update

  switch:
    desc: Alias for rebuild-all
    cmds:
      - task: rebuild-all
